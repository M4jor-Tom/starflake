---
# Labels shared by the workspace and every component repository, so that an
# issue keeps its labels when it is transferred. Applied by `just labels`.
labels:
  - name: triage
    color: "fbca04"
    description: Not yet refined
  - name: bug
    color: "d73a4a"
    description: Something isn't working
  - name: enhancement
    color: "a2eeef"
    description: New feature or request
  - name: game
    color: "1d76db"
    description: Concerns the game
  - name: design
    color: "5319e7"
    description: Concerns the design specification
  - name: ontology
    color: "0e8a16"
    description: Concerns the ontology
